<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="GymProgress: nutrición, entrenamiento de fuerza y evolución personal." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymProgress" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>GymProgress</title>
    <script>
      // Evita el destello de tema al cargar. El tema real se sincroniza con Dexie.
      try {
        var saved = localStorage.getItem('gymprogress-theme')
        var dark = saved ? saved === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0b0e14' : '#f4f5f7')
      } catch (e) {}

      // Desactivar zoom táctil (pinch-to-zoom) en iOS Safari y otros navegadores
      // que ignoran user-scalable=no en el viewport meta.
      (function () {
        // Prevenir gesturestart (iOS Safari)
        document.addEventListener('gesturestart', function (e) { e.preventDefault() }, { passive: false })
        document.addEventListener('gesturechange', function (e) { e.preventDefault() }, { passive: false })
        document.addEventListener('gestureend', function (e) { e.preventDefault() }, { passive: false })

        // Prevenir pinch-to-zoom con dos dedos (touchmove con >1 dedo)
        document.addEventListener('touchmove', function (e) {
          if (e.touches.length > 1) {
            e.preventDefault()
          }
        }, { passive: false })

        // Prevenir doble-tap zoom
        var lastTouchEnd = 0
        document.addEventListener('touchend', function (e) {
          var now = Date.now()
          if (now - lastTouchEnd <= 300) {
            e.preventDefault()
          }
          lastTouchEnd = now
        }, { passive: false })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
